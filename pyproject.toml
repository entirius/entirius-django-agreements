[project]
name = "entirius-django-agreements"
version = "3.0.0"
description = "Consent and agreements module for Entirius: versioned agreement texts, consent audit trail and order snapshots"
keywords = ["django", "ecommerce", "entirius", "consent", "gdpr", "agreements", "newsletter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "pydantic>=2.0",
    "drf-spectacular>=0.27",
    "entirius-py-process-logger>=2.0.0",
    "entirius-django-utils>=2.0.0",
    "entirius-django-regional>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "factory-boy", "dj-database-url", "psycopg[binary]"]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://github.com/entirius/entirius-django-agreements/tree/develop/docs"
Repository = "https://github.com/entirius/entirius-django-agreements"
Changelog = "https://github.com/entirius/entirius-django-agreements/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-django-agreements/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_agreements"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106", "S310"]

[tool.ruff.lint.isort]
known-first-party = ["django_agreements"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--no-migrations"

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# django_pim / django_contentdb / django_crm / django_email: optional integrations
# (lazy imports with try/except ImportError fallbacks)
DEP001 = ["django_pim", "django_contentdb", "django_crm", "django_email"]
