# --- PL: draft Content ---
- model: django_contentdb.content
  pk: 914
  fields:
    uid: 00000003-0003-4000-8000-000000000003
    content:
      tiles:
        00000003-bb01-4000-8000-000000000001:
          core_type: tile-txt-btn
          title: "Polityka newslettera"
          description: >-
            <h1>Polityka newslettera</h1>
            <p>Niniejsza Polityka newslettera opisuje, czego możesz oczekiwać po zapisaniu się
            do naszego newslettera, w jaki sposób przetwarzamy Twoje dane oraz jak w dowolnym
            momencie możesz zarządzać lub wycofać subskrypcję.</p>
            <h2>1. Co będziesz otrzymywać</h2>
            <p>Subskrybując nasz newsletter, będziesz otrzymywać komunikaty handlowe, w tym
            informacje o nowych produktach, oferty promocyjne, treści redakcyjne oraz aktualności
            ze sklepu. Staramy się, aby nasze newslettery były dopasowane do Twoich zainteresowań
            i historii zakupów.</p>
            <h2>2. Częstotliwość wysyłki</h2>
            <p>Wysyłamy newslettery regularnie, zazwyczaj od dwóch do czterech razy w miesiącu.
            W okresach promocyjnych lub przy ważnych premierach produktów częstotliwość może być
            wyższa. Nie wyślemy więcej niż jednej wiadomości dziennie bez uprzedniego powiadomienia.</p>
            <h2>3. Zgoda i double opt-in</h2>
            <p>Subskrypcja jest dobrowolna i opiera się na Twojej wyraźnej zgodzie. Stosujemy
            procedurę double opt-in: po podaniu adresu e-mail otrzymasz wiadomość potwierdzającą.
            Subskrypcja zostanie aktywowana dopiero po kliknięciu linku potwierdzającego. Chroni
            to przed nieautoryzowanymi zapisami.</p>
            <h2>4. Jak zrezygnować z subskrypcji</h2>
            <p>Możesz zrezygnować z naszego newslettera w dowolnym momencie i bez podawania
            przyczyny. Każdy newsletter zawiera link do rezygnacji na dole wiadomości. Możesz
            również wycofać zgodę w ustawieniach konta lub kontaktując się z nami bezpośrednio.
            Żądania rezygnacji są przetwarzane natychmiast i wchodzą w życie w ciągu 24 godzin.</p>
            <h2>5. Przetwarzanie danych</h2>
            <p>Przetwarzamy Twój adres e-mail oraz — jeśli go podałeś — imię i preferencje, aby
            wysyłać spersonalizowane newslettery. Możemy korzystać z Twojej historii zakupów w celu
            dostosowania treści do Twoich zainteresowań. Podstawą prawną tego przetwarzania jest
            Twoja zgoda (art. 6 ust. 1 lit. a RODO). Twoje dane nie będą udostępniane stronom
            trzecim w ich własnych celach marketingowych.</p>
            <h2>6. Okres przechowywania danych</h2>
            <p>Twój adres e-mail przechowujemy na potrzeby newslettera przez cały czas trwania
            aktywnej subskrypcji. Po rezygnacji przechowujemy zapis zgody i jej wycofania przez
            ustawowy okres przedawnienia, wymagany dla celów compliance i rozstrzygania sporów.
            Sam adres e-mail jest usuwany z aktywnej listy mailingowej w ciągu 24 godzin od
            rezygnacji.</p>
            <h2>7. Podmioty przetwarzające</h2>
            <p>Do wysyłki newsletterów korzystamy z zewnętrznych dostawców usług e-mail.
            Dostawcy ci działają jako podmioty przetwarzające na podstawie umów o przetwarzaniu
            danych i są umownie zobowiązani do nieużywania Twoich danych we własnych celach.</p>
      sections:
        00000003-bb00-4000-8000-000000000001:
          core_type: section-text
          width: content_width
      tiles_order:
        00000003-bb00-4000-8000-000000000001:
          - 00000003-bb01-4000-8000-000000000001
      sections_order:
        - 00000003-bb00-4000-8000-000000000001
    extension: null
    meta:
