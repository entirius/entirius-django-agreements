# --- DE: draft Content ---
- model: django_contentdb.content
  pk: 910
  fields:
    uid: 00000002-0005-4000-8000-000000000005
    content:
      tiles:
        00000002-cc01-4000-8000-000000000001:
          core_type: tile-txt-btn
          title: "Datenschutzerklärung"
          description: >-
            <h1>Datenschutzerklärung</h1>
            <p>Diese Datenschutzerklärung erläutert, wie wir Ihre personenbezogenen Daten erfassen,
            verwenden und schützen, wenn Sie unseren Online-Shop nutzen. Wir verarbeiten Ihre Daten
            gemäß der EU-Datenschutz-Grundverordnung (DSGVO) und dem anwendbaren nationalen Recht.</p>
            <h2>1. Verantwortlicher</h2>
            <p>Verantwortlicher für die Verarbeitung Ihrer personenbezogenen Daten ist der Verkäufer,
            der im Impressum dieser Website angegeben ist. Datenschutzbezogene Anfragen richten Sie
            bitte an die dort angegebene E-Mail-Adresse.</p>
            <h2>2. Erhobene Daten</h2>
            <p>Wir erfassen Daten, die Sie uns direkt mitteilen (Name, E-Mail-Adresse, Lieferadresse,
            Zahlungsinformationen), Daten, die durch Ihre Nutzung des Shops entstehen (Bestellhistorie,
            Surfverhalten) sowie technische Daten (IP-Adresse, Browsertyp, Gerätekennungen), die
            automatisch über Cookies und ähnliche Technologien gesammelt werden.</p>
            <h2>3. Zweck und Rechtsgrundlage</h2>
            <p>Wir verarbeiten Ihre Daten zur Vertragserfüllung (Art. 6 Abs. 1 lit. b DSGVO),
            zur Erfüllung rechtlicher Verpflichtungen wie Rechnungsstellung und Steueraufzeichnungen
            (Art. 6 Abs. 1 lit. c DSGVO), zur Wahrung unserer berechtigten Interessen an der
            Betrugsprävention und Shop-Verbesserung (Art. 6 Abs. 1 lit. f DSGVO) sowie — mit Ihrer
            Einwilligung — zur Zusendung von Marketingmitteilungen (Art. 6 Abs. 1 lit. a DSGVO).</p>
            <h2>4. Ihre Rechte</h2>
            <p>Sie haben das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der
            Verarbeitung, Datenübertragbarkeit und Widerspruch. Soweit die Verarbeitung auf Ihrer
            Einwilligung beruht, können Sie diese jederzeit mit Wirkung für die Zukunft widerrufen.
            Zur Ausübung Ihrer Rechte wenden Sie sich an die im Impressum angegebene Adresse.</p>
            <h2>5. Cookies</h2>
            <p>Wir verwenden technisch notwendige Cookies zum Betrieb des Shops, funktionale Cookies
            zur Speicherung Ihrer Einstellungen sowie — mit Ihrer Einwilligung — Analyse- und
            Marketing-Cookies. Sie können Ihre Cookie-Einstellungen jederzeit über das Cookie-Banner
            oder Ihre Browsereinstellungen verwalten.</p>
            <h2>6. Speicherdauer</h2>
            <p>Bestelldaten speichern wir für den gesetzlich vorgeschriebenen Zeitraum nach
            Handels- und Steuerrecht (in der Regel 5–10 Jahre). Einwilligungsnachweise für
            Marketingzwecke werden für die Dauer der Einwilligung zuzüglich der gesetzlichen
            Verjährungsfrist aufbewahrt. Kontodaten werden innerhalb von 30 Tagen nach Schließung
            des Kontos gelöscht, sofern keine gesetzliche Aufbewahrungspflicht besteht.</p>
            <h2>7. Datenweitergabe</h2>
            <p>Wir geben Ihre Daten an Zahlungsdienstleister, Logistikdienstleister und
            Cloud-Hosting-Anbieter weiter, soweit dies zur Leistungserbringung erforderlich ist.
            Wir verkaufen Ihre personenbezogenen Daten nicht an Dritte. Bei Empfängern außerhalb
            des EWR stellen wir geeignete Garantien sicher, z. B. Standardvertragsklauseln.</p>
            <h2>8. Aufsichtsbehörde</h2>
            <p>Sie haben das Recht, bei der für Sie zuständigen Datenschutzaufsichtsbehörde Beschwerde
            einzulegen. Eine Übersicht der nationalen Behörden finden Sie auf der Website des
            Europäischen Datenschutzausschusses unter https://edpb.europa.eu.</p>
