# --- PL: draft Content ---
- model: django_contentdb.content
  pk: 908
  fields:
    uid: 00000002-0003-4000-8000-000000000003
    content:
      tiles:
        00000002-bb01-4000-8000-000000000001:
          core_type: tile-txt-btn
          title: "Polityka prywatności"
          description: >-
            <h1>Polityka prywatności</h1>
            <p>Niniejsza Polityka prywatności wyjaśnia, w jaki sposób zbieramy, wykorzystujemy
            i chronimy Twoje dane osobowe podczas korzystania z naszego sklepu internetowego.
            Przetwarzamy dane zgodnie z Rozporządzeniem Parlamentu Europejskiego i Rady (UE) 2016/679
            (RODO) oraz obowiązującymi przepisami krajowymi.</p>
            <h2>1. Administrator danych</h2>
            <p>Administratorem danych osobowych jest Sprzedawca wskazany w stopce prawnej tej witryny.
            W sprawach dotyczących ochrony danych prosimy o kontakt pod adresem e-mail wskazanym
            w stopce.</p>
            <h2>2. Zakres zbieranych danych</h2>
            <p>Zbieramy dane podawane przez Ciebie bezpośrednio (imię i nazwisko, adres e-mail,
            adres dostawy, dane płatnicze), dane generowane w trakcie korzystania ze sklepu
            (historia zamówień, zachowanie przeglądania) oraz dane techniczne (adres IP, typ
            przeglądarki, identyfikatory urządzeń) zbierane automatycznie przez pliki cookie
            i podobne technologie.</p>
            <h2>3. Cel i podstawa prawna przetwarzania</h2>
            <p>Przetwarzamy Twoje dane w celu realizacji zamówień i dostarczenia produktów
            (art. 6 ust. 1 lit. b RODO), wypełnienia obowiązków prawnych, takich jak wystawianie
            faktur i prowadzenie dokumentacji podatkowej (art. 6 ust. 1 lit. c RODO), realizacji
            uzasadnionych interesów w zakresie zapobiegania oszustwom i ulepszania sklepu
            (art. 6 ust. 1 lit. f RODO) oraz — za Twoją zgodą — przesyłania komunikacji
            marketingowej (art. 6 ust. 1 lit. a RODO).</p>
            <h2>4. Twoje prawa</h2>
            <p>Masz prawo do dostępu do danych, ich sprostowania, usunięcia, ograniczenia
            przetwarzania, przenoszenia oraz wniesienia sprzeciwu wobec przetwarzania. W przypadku,
            gdy przetwarzanie odbywa się na podstawie zgody, możesz ją wycofać w dowolnym momencie,
            bez wpływu na zgodność z prawem przetwarzania dokonanego przed jej wycofaniem.
            Aby skorzystać z praw, skontaktuj się z nami pod adresem wskazanym w stopce.</p>
            <h2>5. Pliki cookie</h2>
            <p>Używamy niezbędnych plików cookie do działania sklepu, funkcjonalnych do zapamiętywania
            Twoich preferencji oraz — za Twoją zgodą — analitycznych i marketingowych. Ustawieniami
            plików cookie możesz zarządzać w dowolnym momencie za pomocą bannera cookie lub ustawień
            przeglądarki.</p>
            <h2>6. Okres przechowywania danych</h2>
            <p>Dane dotyczące zamówień przechowujemy przez okres wymagany przepisami prawa handlowego
            i podatkowego (zazwyczaj 5–10 lat). Zapisy zgód marketingowych są przechowywane przez czas
            obowiązywania zgody oraz przez okres przedawnienia roszczeń. Dane konta są usuwane w ciągu
            30 dni od jego zamknięcia, chyba że obowiązek przechowywania wynika z przepisów prawa.</p>
            <h2>7. Udostępnianie danych</h2>
            <p>Udostępniamy Twoje dane procesorom płatności, dostawcom usług logistycznych oraz
            dostawcom usług hostingowych wyłącznie w zakresie niezbędnym do świadczenia usług.
            Nie sprzedajemy danych osobowych stronom trzecim. W przypadku odbiorców spoza EOG
            zapewniamy odpowiednie zabezpieczenia, np. Standardowe Klauzule Umowne.</p>
            <h2>8. Organ nadzorczy</h2>
            <p>Masz prawo wniesienia skargi do Prezesa Urzędu Ochrony Danych Osobowych (UODO)
            z siedzibą przy ul. Stawki 2, 00-193 Warszawa. Więcej informacji na stronie
            https://uodo.gov.pl.</p>
      sections:
        00000002-bb00-4000-8000-000000000001:
          core_type: section-text
          width: content_width
      tiles_order:
        00000002-bb00-4000-8000-000000000001:
          - 00000002-bb01-4000-8000-000000000001
      sections_order:
        - 00000002-bb00-4000-8000-000000000001
    extension: null
    meta:
      title: "Polityka prywatności"
      description: "Jak zbieramy, wykorzystujemy i chronimy Twoje dane osobowe (RODO)."
      og_title: "Polityka prywatności"
      og_description: "Twoje prawa i sposób przetwarzania danych osobowych."
    created_at: 2024-01-01 00:00:00+00:00
    updated_at: 2024-01-01 00:00:00+00:00
    category: null

