- model: django_contentdb.content
  pk: 916
  fields:
    uid: 00000003-0005-4000-8000-000000000005
    content:
      tiles:
        00000003-cc01-4000-8000-000000000001:
          core_type: tile-txt-btn
          title: "Newsletter-Richtlinie"
          description: >-
            <h1>Newsletter-Richtlinie</h1>
            <p>Diese Newsletter-Richtlinie beschreibt, was Sie bei der Anmeldung zu unserem Newsletter
            erwarten können, wie Ihre Daten verwendet werden und wie Sie Ihr Abonnement jederzeit
            verwalten oder widerrufen können.</p>
            <h2>1. Was Sie erhalten werden</h2>
            <p>Mit der Anmeldung zu unserem Newsletter erhalten Sie Werbemitteilungen, darunter
            Informationen zu neuen Produkten, Sonderangebote, redaktionelle Inhalte und
            Shop-Neuigkeiten. Wir bemühen uns, Newsletter zu versenden, die auf Ihre Interessen
            und Ihre Kaufhistorie abgestimmt sind.</p>
            <h2>2. Versandfrequenz</h2>
            <p>Wir versenden Newsletter regelmäßig, in der Regel zwei- bis viermal pro Monat.
            In Aktionszeiträumen oder bei wichtigen Produkteinführungen kann die Häufigkeit höher
            sein. Ohne vorherige Ankündigung versenden wir nicht mehr als eine E-Mail pro Tag.</p>
            <h2>3. Einwilligung und Double-Opt-In</h2>
            <p>Ihre Anmeldung erfolgt freiwillig und auf Grundlage Ihrer ausdrücklichen Einwilligung.
            Wir nutzen das Double-Opt-In-Verfahren: Nach Eingabe Ihrer E-Mail-Adresse erhalten Sie
            eine Bestätigungs-E-Mail. Ihr Abonnement wird erst nach dem Klick auf den
            Bestätigungslink aktiviert. Dies schützt Sie vor unautorisierten Anmeldungen.</p>
            <h2>4. Abmeldung</h2>
            <p>Sie können den Newsletter jederzeit und ohne Angabe von Gründen abbestellen.
            Jeder Newsletter enthält am Ende einen Abmeldelink. Sie können Ihre Einwilligung auch
            über Ihre Kontoeinstellungen oder durch direkte Kontaktaufnahme widerrufen.
