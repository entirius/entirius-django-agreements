# ContentDB legal pages for django-agreements.
#
# Creates three globally-scoped static pages (no channel restriction):
#   - terms               Terms and Conditions (EN, PL, DE)
#   - privacy             Privacy Policy (EN, PL, DE)
#   - newsletter-policy   Newsletter Policy (EN, PL, DE)
#
# Load order (IMPORTANT):
#   1. django_contentdb.cfg.yaml  — ContentType pk=1 (static-page), Language records
#   2. This file                  — Content / Draft / Published / Route records
#
# Assumptions:
#   ContentType pk=6  = legal-page
#   Language pk=1     = EN
#   Language pk=2     = PL
#   Language pk=3     = DE
#
# PKs reserved by this fixture:
#   Content      900-917  (odd = draft body, even = published snapshot)
#   Draft        900-908
#   Published    900-908
#   Route        900-908
#   ContentSet   900-902
#   DraftToContentSet 900-908
#
# UUID namespaces:
#   00000001-*  Terms and Conditions
#   00000002-*  Privacy Policy
#   00000003-*  Newsletter Policy
#
# Language suffix per record index within each page:
#   01 = EN, 02 = PL, 03 = DE

# =============================================================================
# TERMS AND CONDITIONS
# =============================================================================

# --- EN: draft Content ---
- model: django_contentdb.content
  pk: 900
  fields:
    uid: 00000001-0001-4000-8000-000000000001
    content:
      tiles:
        00000001-aa01-4000-8000-000000000001:
          core_type: tile-txt-btn
          title: "Terms and Conditions"
          description: >-
            <h1>Terms and Conditions</h1>
            <p>These Terms and Conditions govern your use of our online store and the purchase of products
            through our platform. By placing an order you confirm that you have read, understood, and
            accepted these terms in full.</p>
            <h2>1. Scope of Application</h2>
            <p>These terms apply to all contracts concluded between the Seller and the Customer via this
            online store. Any deviating terms of the Customer are not recognised unless the Seller
            expressly agrees to their validity in writing.</p>
            <h2>2. Ordering Process</h2>
            <p>The presentation of products in the online store constitutes an invitation to submit an
            offer. By clicking "Place Order" the Customer submits a binding offer to purchase the selected
            products. A contract is formed when the Seller sends an order confirmation by email.</p>
            <h2>3. Prices and Payment</h2>
            <p>All prices are inclusive of applicable VAT. The Seller accepts major credit and debit cards,
            bank transfer, and other payment methods displayed at checkout. Payment is due immediately upon
            placing an order. In the event of payment default the Seller reserves the right to charge
            statutory interest.</p>
            <h2>4. Delivery</h2>
            <p>Delivery times stated on the product page are estimates only. The Seller shall not be
            liable for delays caused by third-party carriers or events outside its reasonable control.
            Risk of loss passes to the Customer upon handover to the carrier.</p>
            <h2>5. Right of Withdrawal</h2>
            <p>In accordance with applicable EU consumer law, Customers have the right to withdraw from
            the contract within 14 days of receiving the goods, without giving any reason. To exercise
            this right, the Customer must notify the Seller by means of an unequivocal statement before
            the withdrawal period expires.</p>
            <h2>6. Returns and Refunds</h2>
            <p>Returned goods must be in their original condition and packaging. The Seller will process
            refunds within 14 days of receiving the returned goods or proof of return shipment, whichever
            is earlier. Return shipping costs are borne by the Customer unless the goods are defective.</p>
            <h2>7. Liability</h2>
            <p>The Seller's liability for ordinary negligence is limited to foreseeable, contract-typical
            damage. This limitation does not apply to claims arising from injury to life, body, or health,
            or to damages caused by gross negligence or wilful misconduct.</p>
            <h2>8. Governing Law</h2>
            <p>These terms are governed by the law of the country in which the Seller is established.
            Mandatory consumer protection provisions of the Customer's country of habitual residence
            remain unaffected.</p>
            <h2>9. Dispute Resolution</h2>
            <p>The European Commission provides an online dispute resolution platform at
            https://ec.europa.eu/consumers/odr. We are not obliged to participate in alternative dispute
            resolution proceedings before a consumer arbitration board, but we are willing to do so.</p>
      sections:
        00000001-aa00-4000-8000-000000000001:
          core_type: section-text
          width: content_width
      tiles_order:
        00000001-aa00-4000-8000-000000000001:
          - 00000001-aa01-4000-8000-000000000001
      sections_order:
        - 00000001-aa00-4000-8000-000000000001
    extension: null
    meta:
      title: "Terms and Conditions"
      description: "Terms and Conditions governing the use of our online store."
      og_title: "Terms and Conditions"
      og_description: "Read our Terms and Conditions before placing an order."
    created_at: 2024-01-01 00:00:00+00:00
    updated_at: 2024-01-01 00:00:00+00:00
    category: null

