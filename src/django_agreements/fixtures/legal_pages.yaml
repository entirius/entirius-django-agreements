- model: django_contentdb.content
  pk: 906
  fields:
    uid: 00000002-0001-4000-8000-000000000001
    content:
      tiles:
        00000002-aa01-4000-8000-000000000001:
          core_type: tile-txt-btn
          title: "Privacy Policy"
          description: >-
            <h1>Privacy Policy</h1>
            <p>This Privacy Policy explains how we collect, use, and protect your personal data
            when you use our online store. We are committed to handling your data in accordance
            with the EU General Data Protection Regulation (GDPR) and applicable national law.</p>
            <h2>1. Data Controller</h2>
            <p>The data controller responsible for the processing of your personal data is the
            Seller as identified in the Legal Notice section of this website. You may contact us
            at the email address provided there for any data protection enquiries.</p>
            <h2>2. Data We Collect</h2>
            <p>We collect data you provide directly (name, email address, delivery address, payment
            information), data generated by your use of our store (browsing behaviour, order history),
            and technical data (IP address, browser type, device identifiers) collected automatically
            via cookies and similar technologies.</p>
            <h2>3. Purpose and Legal Basis</h2>
            <p>We process your data to fulfil your orders and deliver products (Art. 6(1)(b) GDPR),
            to comply with our legal obligations such as invoicing and tax records (Art. 6(1)(c) GDPR),
            to pursue our legitimate interests in fraud prevention and store improvement
            (Art. 6(1)(f) GDPR), and — where you have given consent — to send you marketing
            communications (Art. 6(1)(a) GDPR).</p>
            <h2>4. Your Rights</h2>
            <p>You have the right to access, rectify, erase, restrict, or port your personal data,
            and to object to certain processing activities. Where processing is based on consent,
            you may withdraw that consent at any time without affecting the lawfulness of prior
            processing. To exercise these rights, contact us at the address in the Legal Notice.</p>
            <h2>5. Cookies</h2>
            <p>We use strictly necessary cookies to operate the store, functional cookies to remember
            your preferences, and — with your consent — analytics and marketing cookies. You can manage
            cookie settings at any time via the cookie banner or your browser settings.</p>
            <h2>6. Data Retention</h2>
            <p>We retain your order data for the period required by applicable commercial and tax law
            (typically 5–10 years). Marketing consent records are kept for as long as the consent is
            active plus the statutory limitation period. Account data is deleted within 30 days of
            account closure, unless retention is legally required.</p>
            <h2>7. Data Sharing</h2>
            <p>We share your data with payment processors, logistics providers, and cloud hosting
            providers strictly to the extent necessary to deliver our services. We do not sell your
            personal data to third parties. Where recipients are located outside the EEA, we ensure
            appropriate safeguards are in place (e.g., Standard Contractual Clauses).</p>
            <h2>8. Supervisory Authority</h2>
            <p>You have the right to lodge a complaint with the data protection supervisory authority
            in your country of residence. A list of national authorities is available on the European
            Data Protection Board website at https://edpb.europa.eu.</p>
      sections:
        00000002-aa00-4000-8000-000000000001:
          core_type: section-text
          width: content_width
      tiles_order:
        00000002-aa00-4000-8000-000000000001:
          - 00000002-aa01-4000-8000-000000000001
      sections_order:
        - 00000002-aa00-4000-8000-000000000001
    extension: null
    meta:
      title: "Privacy Policy"
      description: "How we collect, use, and protect your personal data (GDPR)."
      og_title: "Privacy Policy"
      og_description: "Your data rights and how we handle personal information."
    created_at: 2024-01-01 00:00:00+00:00
    updated_at: 2024-01-01 00:00:00+00:00
    category: null

