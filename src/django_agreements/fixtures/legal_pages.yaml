# --- EN: draft Content ---
- model: django_contentdb.content
  pk: 912
  fields:
    uid: 00000003-0001-4000-8000-000000000001
    content:
      tiles:
        00000003-aa01-4000-8000-000000000001:
          core_type: tile-txt-btn
          title: "Newsletter Policy"
          description: >-
            <h1>Newsletter Policy</h1>
            <p>This Newsletter Policy describes what you can expect when you subscribe to our
            newsletter, how your data is used, and how you can manage or withdraw your subscription
            at any time.</p>
            <h2>1. What You Will Receive</h2>
            <p>By subscribing to our newsletter you will receive commercial communications including
            new product announcements, promotional offers, curated editorial content, and store news.
            We aim to send newsletters that are relevant to your interests and purchase history.</p>
            <h2>2. Sending Frequency</h2>
            <p>We send newsletters regularly, typically between two and four times per month. During
            promotional periods or major product launches the frequency may be higher. We will not
            send more than one email per day without prior notice.</p>
            <h2>3. Consent and Double Opt-In</h2>
            <p>Your subscription is voluntary and based on your explicit consent. We use a double
            opt-in process: after entering your email address you will receive a confirmation email.
            Your subscription is activated only after you click the confirmation link. This protects
            you against unauthorised sign-ups.</p>
            <h2>4. How to Unsubscribe</h2>
            <p>You may unsubscribe from our newsletter at any time and without giving any reason.
            Every newsletter contains an unsubscribe link at the bottom. You may also withdraw your
            consent via your account settings or by contacting us directly. Unsubscribe requests are
            processed immediately and take effect within 24 hours.</p>
            <h2>5. Data Processing</h2>
            <p>We process your email address and — if provided — your name and preferences to send
            you personalised newsletters. We may use your order history to tailor content to your
            interests. The legal basis for this processing is your consent (Art. 6(1)(a) GDPR).
            Your data will not be shared with third parties for their own marketing purposes.</p>
            <h2>6. Data Retention</h2>
            <p>We retain your email address for newsletter purposes for as long as your subscription
            is active. After unsubscribing we keep a record of your consent and withdrawal for the
            statutory limitation period as required for compliance and dispute resolution purposes.
            The email address itself is removed from our active mailing list within 24 hours of
            unsubscribing.</p>
            <h2>7. Service Providers</h2>
            <p>We use third-party email service providers to send our newsletters. These providers
            act as data processors under data processing agreements and are contractually prohibited
            from using your data for their own purposes.</p>
      sections:
        00000003-aa00-4000-8000-000000000001:
          core_type: section-text
          width: content_width
      tiles_order:
        00000003-aa00-4000-8000-000000000001:
          - 00000003-aa01-4000-8000-000000000001
      sections_order:
        - 00000003-aa00-4000-8000-000000000001
    extension: null
    meta:
      title: "Newsletter Policy"
      description: "What to expect from our newsletter and how to manage your subscription."
      og_title: "Newsletter Policy"
      og_description: "Subscription terms, frequency, and how to unsubscribe."
    created_at: 2024-01-01 00:00:00+00:00
    updated_at: 2024-01-01 00:00:00+00:00
    category: null

