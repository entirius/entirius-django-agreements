- model: django_contentdb.content
  pk: 904
  fields:
    uid: 00000001-0005-4000-8000-000000000005
    content:
      tiles:
        00000001-cc01-4000-8000-000000000001:
          core_type: tile-txt-btn
          title: "Allgemeine Geschäftsbedingungen"
          description: >-
            <h1>Allgemeine Geschäftsbedingungen (AGB)</h1>
            <p>Diese Allgemeinen Geschäftsbedingungen regeln die Nutzung unseres Online-Shops
            sowie den Kauf von Produkten über unsere Plattform. Mit Aufgabe einer Bestellung
            bestätigt der Kunde, diese AGB vollständig gelesen und akzeptiert zu haben.</p>
            <h2>1. Geltungsbereich</h2>
            <p>Diese AGB gelten für alle Verträge, die zwischen dem Verkäufer und dem Kunden
            über den Online-Shop geschlossen werden. Abweichende Bedingungen des Kunden werden
            nicht anerkannt, es sei denn, der Verkäufer stimmt deren Geltung ausdrücklich
            schriftlich zu.</p>
            <h2>2. Bestellvorgang</h2>
            <p>Die Darstellung von Produkten im Online-Shop stellt eine Aufforderung zur Abgabe
            eines Angebots dar. Mit dem Klick auf „Jetzt kaufen" gibt der Kunde ein verbindliches
            Kaufangebot ab. Der Vertrag kommt zustande, wenn der Verkäufer eine Auftragsbestätigung
            per E-Mail versendet.</p>
            <h2>3. Preise und Zahlung</h2>
            <p>Alle Preise verstehen sich inklusive der gesetzlichen Mehrwertsteuer. Der Verkäufer
            akzeptiert gängige Kredit- und Debitkarten, Banküberweisung sowie weitere an der Kasse
            angezeigte Zahlungsmethoden. Die Zahlung ist unmittelbar bei Bestellaufgabe fällig.</p>
            <h2>4. Lieferung</h2>
            <p>Auf der Produktseite angegebene Lieferzeiten sind Schätzungen. Der Verkäufer haftet
            nicht für Verzögerungen, die durch Drittanbieter oder Ereignisse außerhalb seiner
            Kontrolle verursacht werden. Die Gefahr geht mit der Übergabe der Ware an den
            Spediteur auf den Kunden über.</p>
            <h2>5. Widerrufsrecht</h2>
            <p>Gemäß dem geltenden EU-Verbraucherrecht haben Verbraucher das Recht, den Vertrag
            innerhalb von 14 Tagen nach Erhalt der Ware ohne Angabe von Gründen zu widerrufen.
            Zur Ausübung dieses Rechts muss der Kunde den Verkäufer vor Ablauf der Widerrufsfrist
            durch eine eindeutige Erklärung informieren.</p>
            <h2>6. Rückgabe und Erstattung</h2>
            <p>Zurückgesendete Waren müssen sich im Originalzustand und in der Originalverpackung
            befinden. Der Verkäufer erstattet den Kaufpreis innerhalb von 14 Tagen nach Eingang
            der Rücksendung oder des Rücksendebelegs, je nachdem, was zuerst eintritt. Die
            Rücksendekosten trägt der Kunde, sofern die Ware nicht mangelhaft ist.</p>
            <h2>7. Haftung</h2>
            <p>Die Haftung des Verkäufers für einfache Fahrlässigkeit ist auf vorhersehbare,
            vertragstypische Schäden begrenzt. Diese Beschränkung gilt nicht für Ansprüche
            wegen Verletzung von Leben, Körper oder Gesundheit sowie Schäden durch grobe
            Fahrlässigkeit oder Vorsatz.</p>
            <h2>8. Anwendbares Recht</h2>
            <p>Diese AGB unterliegen dem Recht des Landes, in dem der Verkäufer seinen Sitz hat.
            Zwingende Verbraucherschutzvorschriften des Wohnsitzlandes des Kunden bleiben
            unberührt.</p>
            <h2>9. Streitbeilegung</h2>
            <p>Die Europäische Kommission stellt eine Plattform zur Online-Streitbeilegung unter
            https://ec.europa.eu/consumers/odr bereit. Wir sind nicht verpflichtet, an einem
            Streitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle teilzunehmen,
            sind jedoch bereit, dies freiwillig zu tun.</p>
      sections:
        00000001-cc00-4000-8000-000000000001:
          core_type: section-text
          width: content_width
      tiles_order:
        00000001-cc00-4000-8000-000000000001:
          - 00000001-cc01-4000-8000-000000000001
      sections_order:
        - 00000001-cc00-4000-8000-000000000001
    extension: null
    meta:
      title: "Allgemeine Geschäftsbedingungen"
      description: "AGB für die Nutzung unseres Online-Shops."
      og_title: "AGB"
      og_description: "Lesen Sie unsere AGB vor der Bestellung."
    created_at: 2024-01-01 00:00:00+00:00
    updated_at: 2024-01-01 00:00:00+00:00
    category: null

