- model: django_contentdb.content
  pk: 902
  fields:
    uid: 00000001-0003-4000-8000-000000000003
    content:
      tiles:
        00000001-bb01-4000-8000-000000000001:
          core_type: tile-txt-btn
          title: "Regulamin"
          description: >-
            <h1>Regulamin sklepu internetowego</h1>
            <p>Niniejszy Regulamin określa zasady korzystania ze sklepu internetowego oraz warunki
            zawierania umów sprzedaży. Składając zamówienie, Klient potwierdza, że zapoznał się
            z Regulaminem i akceptuje jego postanowienia.</p>
            <h2>1. Postanowienia ogólne</h2>
            <p>Regulamin stosuje się do wszystkich umów zawieranych między Sprzedawcą a Klientem za
            pośrednictwem sklepu internetowego. Wszelkie odmienne warunki Klienta nie są uznawane,
            chyba że Sprzedawca wyraźnie wyraził na nie pisemną zgodę.</p>
            <h2>2. Składanie zamówień</h2>
            <p>Prezentacja produktów w sklepie stanowi zaproszenie do złożenia oferty. Klikając
            „Złóż zamówienie", Klient składa wiążącą ofertę zakupu wybranych produktów. Umowa
            zostaje zawarta z chwilą wysłania przez Sprzedawcę potwierdzenia zamówienia drogą
            elektroniczną.</p>
            <h2>3. Ceny i płatności</h2>
            <p>Wszystkie ceny zawierają należny podatek VAT. Sprzedawca akceptuje karty płatnicze,
            przelew bankowy oraz inne metody płatności wskazane przy kasie. Płatność jest wymagana
            niezwłocznie po złożeniu zamówienia.</p>
            <h2>4. Dostawa</h2>
            <p>Podane terminy dostawy mają charakter orientacyjny. Sprzedawca nie ponosi
            odpowiedzialności za opóźnienia wynikające z działania przewoźników lub zdarzeń
            pozostających poza jego kontrolą. Ryzyko utraty przechodzi na Klienta z chwilą
            przekazania towaru przewoźnikowi.</p>
            <h2>5. Prawo do odstąpienia od umowy</h2>
            <p>Zgodnie z obowiązującymi przepisami prawa UE, Klient będący konsumentem ma prawo
            odstąpić od umowy w terminie 14 dni od dnia otrzymania towaru, bez podawania przyczyny.
            W celu skorzystania z tego prawa, Klient zobowiązany jest złożyć Sprzedawcy jednoznaczne
            oświadczenie przed upływem terminu odstąpienia.</p>
            <h2>6. Zwroty i refundacje</h2>
            <p>Zwracany towar musi być w oryginalnym stanie i opakowaniu. Sprzedawca zwróci środki
            w terminie 14 dni od dnia otrzymania zwrotu lub dowodu nadania przesyłki, w zależności
            od tego, które zdarzenie nastąpi wcześniej. Koszty odesłania ponosi Klient, chyba że
            towar jest wadliwy.</p>
            <h2>7. Odpowiedzialność</h2>
            <p>Odpowiedzialność Sprzedawcy z tytułu zwykłego zaniedbania jest ograniczona do
            typowych, przewidywalnych strat wynikających z umowy. Ograniczenie to nie dotyczy
            szkód na osobie ani strat wynikłych z rażącego niedbalstwa lub umyślnego działania.</p>
            <h2>8. Prawo właściwe</h2>
            <p>Niniejszy Regulamin podlega prawu kraju, w którym Sprzedawca ma siedzibę.
            Bezwzględnie obowiązujące przepisy ochrony konsumentów kraju zamieszkania Klienta
            pozostają nienaruszone.</p>
            <h2>9. Rozwiązywanie sporów</h2>
            <p>Komisja Europejska udostępnia platformę do internetowego rozstrzygania sporów pod
            adresem https://ec.europa.eu/consumers/odr. Jesteśmy gotowi uczestniczyć w pozasądowym
            rozwiązywaniu sporów przed podmiotami wskazanymi przez Urząd Ochrony Konkurencji
            i Konsumentów.</p>
      sections:
        00000001-bb00-4000-8000-000000000001:
          core_type: section-text
          width: content_width
      tiles_order:
        00000001-bb00-4000-8000-000000000001:
          - 00000001-bb01-4000-8000-000000000001
      sections_order:
        - 00000001-bb00-4000-8000-000000000001
    extension: null
    meta:
      title: "Regulamin"
      description: "Regulamin sklepu internetowego."
      og_title: "Regulamin"
      og_description: "Zapoznaj się z Regulaminem przed złożeniem zamówienia."
    created_at: 2024-01-01 00:00:00+00:00
    updated_at: 2024-01-01 00:00:00+00:00
    category: null

