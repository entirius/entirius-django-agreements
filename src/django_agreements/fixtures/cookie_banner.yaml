# Default cookie banner (PL/EN/DE/ES) — a global `cookies` definition with one DRAFT version.
# Load once with: python manage.py loaddata cookie_banner
# then publish the version through the admin API (POST versions/100/publish/).
#
# A global banner must cover the languages of every channel (publish_version refuses otherwise). A channel that
# speaks another language needs its texts added to the draft first (summary, categories, buttons, dialog texts).
#
# Opt-in, not part of default_agreements. A re-load resets both rows (the version becomes a draft again);
# later text changes are a new version, never an edit of this fixture on a live stack.
# Texts are brand-free drafts for legal review, stored already sanitised (tests compare with sanitize_html).

- model: django_agreements.agreementdefinition
  pk: 100
  fields:
    slug: cookie-banner
    name: Cookie banner
    category: cookies
    consent_channel: web
    content_route: ""
    is_active: true
    is_system: true
    display_contexts: []
    sort_order: 100
    channels: []
    created_at: "2026-09-24T00:00:00Z"
    modified_at: "2026-09-24T00:00:00Z"

- model: django_agreements.agreementversion
  pk: 100
  fields:
    definition: 100
    version_number: 1
    summary_t9n:
      pl: 'Używamy plików cookie. Niezbędne działają zawsze. Analityczne i marketingowe — w tym personalizację reklam — włączymy tylko za Twoją zgodą. Zmienisz ją w każdej chwili w stopce, w sekcji Twoje zgody. <a href="/pl/polityka-cookies">Polityka cookies</a>'
      en: 'We use cookies. Necessary cookies are always on. Analytics and marketing cookies — including ads personalisation — are used only with your consent. You can change it at any time in the footer, under Your consents. <a href="/en/cookie-policy">Cookie policy</a>'
      de: 'Wir verwenden Cookies. Notwendige Cookies sind immer aktiv. Analyse- und Marketing-Cookies, auch zur Personalisierung von Werbung, nutzen wir nur mit deiner Einwilligung. Du kannst sie jederzeit in der Fußzeile unter Deine Einwilligungen ändern. <a href="/de/cookie-richtlinie">Cookie-Richtlinie</a>'
      es: 'Usamos cookies. Las necesarias están siempre activas. Las analíticas y de marketing, incluida la personalización de anuncios, solo con tu consentimiento. Puedes cambiarlo en cualquier momento en el pie de página, en Tus consentimientos. <a href="/es/politica-de-cookies">Política de cookies</a>'
    cookie_banner:
      categories:
        - key: necessary
          required: true
          consent_mode: []
          label_t9n:
            pl: Niezbędne
            en: Necessary
            de: Notwendig
            es: Necesarias
          description_t9n:
            pl: 'Zapewniają działanie strony i zapamiętują Twój wybór. Nie można ich wyłączyć.'
            en: 'Keep the site working and remember your choice. They cannot be switched off.'
            de: 'Halten die Seite am Laufen und merken sich deine Auswahl. Sie können nicht abgeschaltet werden.'
            es: 'Mantienen el sitio en funcionamiento y recuerdan tu elección. No se pueden desactivar.'
        - key: analytics
          required: false
          consent_mode: [analytics_storage]
          label_t9n:
            pl: Analityczne
            en: Analytics
            de: Analyse
            es: Analíticas
          description_t9n:
            pl: 'Pokazują nam, jak korzystasz ze strony (Google Analytics, Microsoft Clarity), żebyśmy mogli ją ulepszać.'
            en: 'Show us how the site is used (Google Analytics, Microsoft Clarity) so we can improve it.'
            de: 'Zeigen uns, wie die Seite genutzt wird (Google Analytics, Microsoft Clarity), damit wir sie verbessern können.'
            es: 'Nos muestran cómo se usa el sitio (Google Analytics, Microsoft Clarity) para poder mejorarlo.'
        - key: marketing
          required: false
          consent_mode: [ad_storage, ad_user_data, ad_personalization]
          label_t9n:
