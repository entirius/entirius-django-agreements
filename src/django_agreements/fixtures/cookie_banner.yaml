          description_t9n:
            pl: 'Mierzą skuteczność reklam i pozwalają je personalizować (Google Ads, Microsoft Advertising). <a href="https://business.safety.google/privacy/">Jak Google wykorzystuje dane</a>'
            en: 'Measure ad performance and allow ads personalisation (Google Ads, Microsoft Advertising). <a href="https://business.safety.google/privacy/">How Google uses data</a>'
            de: 'Messen die Werbewirkung und erlauben es, Werbung zu personalisieren (Google Ads, Microsoft Advertising). <a href="https://business.safety.google/privacy/">So verwendet Google Daten</a>'
            es: 'Miden el rendimiento de los anuncios y permiten personalizarlos (Google Ads, Microsoft Advertising). <a href="https://business.safety.google/privacy/">Cómo usa Google los datos</a>'
      buttons_t9n:
